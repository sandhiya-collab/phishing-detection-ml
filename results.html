<!-- templates/results.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Results | PhishGuard AI</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        @font-face {
            font-family: 'SF Pro Display';
            src: url('https://applesocial.s3.amazonaws.com/assets/styles/fonts/sanfrancisco/sanfranciscodisplay-regular-webfont.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'SF Pro Display';
            src: url('https://applesocial.s3.amazonaws.com/assets/styles/fonts/sanfrancisco/sanfranciscodisplay-medium-webfont.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'SF Pro Display';
            src: url('https://applesocial.s3.amazonaws.com/assets/styles/fonts/sanfrancisco/sanfranciscodisplay-semibold-webfont.woff2') format('woff2');
            font-weight: 600;
            font-style: normal;
        }
        @font-face {
            font-family: 'SF Pro Display';
            src: url('https://applesocial.s3.amazonaws.com/assets/styles/fonts/sanfrancisco/sanfranciscodisplay-bold-webfont.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
        }
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, #0f172a 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        /* Top Bar for Results Page */
        .results-top-bar {
            height: 70px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 900;
        }
        
        .results-breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .back-to-home {
            padding: 0.5rem 1rem;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .back-to-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3);
        }
        
        /* Main content with padding for top bar */
        .results-main-content {
            margin-top: 70px;
            padding: 2rem;
            min-height: calc(100vh - 70px);
        }
        
        /* Full-screen loader - exactly like original */
        .fullscreen-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .fullscreen-loader.hidden {
            display: none;
        }
        
        /* Content wrapper */
        .results-container {
            display: none;
        }
        
        .results-container.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Make sure all the original styles work */
        :root {
            --primary: #0a1932;
            --secondary: #1a2b4d;
            --accent: #2563eb;
            --accent-light: #3b82f6;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --info: #06b6d4;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #2d3748;
            --card-bg: rgba(15, 23, 42, 0.7);
        }
    </style>
</head>
<body>
    <!-- Top Bar -->
<div class="results-top-bar">
    <div class="results-breadcrumb">
        <a href="/" class="back-to-home">
            <i class="fas fa-arrow-left"></i>
            Back to Analysis
        </a>
    </div>
    <div style="display: flex; align-items: center;">
        <img src="{{ url_for('static', filename='icon.png') }}" alt="PhishGuard Icon" style="width: 30px; height: 30px; margin-right: 8px;">
        <h2 style="font-size: 1.25rem; background: linear-gradient(to right, #ffffff, var(--accent-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0;">
            PhishGuard AI
        </h2>
    </div>
</div>

    <!-- Full-screen Loader (EXACTLY like original) -->
    <div id="fullscreenLoader" class="fullscreen-loader">
        <div class="loader-content">
            <div class="ai-loader">
                <div class="ai-loader-inner">
                    <i class="fas fa-brain"></i>
                </div>
            </div>
            <h3>AI Analysis in Progress</h3>
            <p>Scanning content with multiple threat intelligence engines</p>
            <div class="progress-stack">
                <div class="progress-item">
                    <span>Pattern Recognition</span>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 40%"></div>
                    </div>
                </div>
                <div class="progress-item">
                    <span>Threat Intelligence</span>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 20%"></div>
                    </div>
                </div>
                <div class="progress-item">
                    <span>ML Classification</span>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 10%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Results Container (will be populated dynamically) -->
    <div class="results-main-content">
        <div id="resultsContainer" class="results-container"></div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="/static/results.js"></script>
</body>
</html>
