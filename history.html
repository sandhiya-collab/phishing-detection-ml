<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan History - PhishGuard AI</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, var(--primary) 0%, #0f172a 100%);
            min-height: 100vh;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .history-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 1.5rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent);
            transform: translateX(-5px);
        }

        .history-header {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-radius: 24px;
            padding: 3rem 2rem;
            margin-bottom: 2rem;
            color: white;
            text-align: center;
        }

        .history-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .history-header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .filters-section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            align-items: end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-group label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .filter-group select, .filter-group input {
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .filter-group select:focus, .filter-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .search-box {
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
        }

        .filter-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        .btn-filter {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-filter:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3);
        }

        .btn-reset {
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow-x: auto;
            backdrop-filter: blur(10px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th {
            background: rgba(0, 0, 0, 0.3);
            padding: 1.25rem 1rem;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .type-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .type-badge.url {
            background: rgba(37, 99, 235, 0.15);
            color: var(--accent);
            border: 1px solid rgba(37, 99, 235, 0.3);
        }

        .type-badge.email {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .type-badge.message {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .verdict-badge {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
        }

        .verdict-badge.phishing {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .verdict-badge.suspicious {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        .verdict-badge.safe {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .risk-level {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .risk-bar {
            width: 60px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .risk-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        .risk-fill.critical {
            background: var(--danger);
        }

        .risk-fill.elevated {
            background: var(--warning);
        }

        .risk-fill.minimal {
            background: var(--success);
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .btn-icon:hover {
            background: rgba(37, 99, 235, 0.1);
            color: var(--accent);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .btn-icon.delete:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border-color: var(--danger);
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            padding: 1rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .pagination-info {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .pagination-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .page-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .page-btn:hover:not(:disabled) {
            background: rgba(37, 99, 235, 0.1);
            color: var(--accent);
            border-color: var(--accent);
        }

        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-numbers {
            display: flex;
            gap: 0.25rem;
        }

        .page-number {
            min-width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .page-number:hover {
            background: rgba(37, 99, 235, 0.1);
            color: var(--accent);
            border-color: var(--accent);
        }

        .page-number.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-icon {
            font-size: 4rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .empty-state p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .btn-primary {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
        }

        @media (max-width: 768px) {
            .history-container {
                padding: 1rem;
            }

            .filters-grid {
                grid-template-columns: 1fr;
            }

            .filter-actions {
                justify-content: stretch;
            }

            .filter-actions button {
                flex: 1;
            }

            .pagination {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="history-container">
        <a href="/profile" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Profile
        </a>

        <div class="history-header">
            <h1><i class="fas fa-history"></i> Scan History</h1>
            <p>View and manage all your past analyses</p>
        </div>

        <div class="filters-section">
            <div class="filters-grid">
                <div class="filter-group">
                    <label for="search"><i class="fas fa-search"></i> Search</label>
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="search" placeholder="Search by content or verdict...">
                    </div>
                </div>

                <div class="filter-group">
                    <label for="typeFilter"><i class="fas fa-filter"></i> Type</label>
                    <select id="typeFilter">
                        <option value="all">All Types</option>
                        <option value="url">URL</option>
                        <option value="email">Email</option>
                        <option value="message">Message</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="riskFilter"><i class="fas fa-exclamation-triangle"></i> Risk Level</label>
                    <select id="riskFilter">
                        <option value="all">All Risks</option>
                        <option value="safe">Safe</option>
                        <option value="suspicious">Suspicious</option>
                        <option value="phishing">Phishing</option>
                    </select>
                </div>

                <div class="filter-actions">
                    <button class="btn-filter" onclick="applyFilters()">
                        <i class="fas fa-filter"></i> Apply Filters
                    </button>
                    <button class="btn-reset" onclick="resetFilters()">
                        <i class="fas fa-undo"></i> Reset
                    </button>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table id="historyTable">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Type</th>
                        <th>Content</th>
                        <th>Verdict</th>
                        <th>Risk Level</th>
                        <th>Confidence</th>
                        <th>Source</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="8" class="empty-state">
                            <div class="empty-icon">
                                <i class="fas fa-inbox"></i>
                            </div>
                            <h3>Loading your history...</h3>
                            <p>Please wait while we fetch your scans.</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" id="pagination">
            <div class="pagination-info">
                Showing <span id="startItem">0</span> - <span id="endItem">0</span> of <span id="totalItems">0</span> scans
            </div>
            <div class="pagination-controls">
                <button class="page-btn" id="prevBtn" onclick="changePage('prev')" disabled>
                    <i class="fas fa-chevron-left"></i>
                </button>
                <div class="page-numbers" id="pageNumbers"></div>
                <button class="page-btn" id="nextBtn" onclick="changePage('next')" disabled>
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script>
        let currentPage = 1;
        let totalPages = 1;
        let totalItems = 0;
        let currentFilters = {
            search: '',
            type: 'all',
            risk: 'all'
        };

        // Load history on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadHistory();
        });

        // Load history with filters
        async function loadHistory(page = 1) {
            const tableBody = document.getElementById('tableBody');
            
            // Build query string
            const params = new URLSearchParams({
                page: page,
                per_page: 10
            });
            
            if (currentFilters.search) params.append('search', currentFilters.search);
            if (currentFilters.type !== 'all') params.append('type', currentFilters.type);
            if (currentFilters.risk !== 'all') params.append('risk', currentFilters.risk);

            try {
                const response = await fetch(`/api/history?${params.toString()}`);
                const data = await response.json();

                if (data.success) {
                    displayHistory(data);
                } else {
                    showToast('Failed to load history', 'error');
                }
            } catch (error) {
                console.error('Error loading history:', error);
                showToast('Error loading history', 'error');
            }
        }

        // Display history in table
        function displayHistory(data) {
            const tableBody = document.getElementById('tableBody');
            const startItem = document.getElementById('startItem');
            const endItem = document.getElementById('endItem');
            const totalItemsEl = document.getElementById('totalItems');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            if (!data.scans || data.scans.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="8" class="empty-state">
                            <div class="empty-icon">
                                <i class="fas fa-inbox"></i>
                            </div>
                            <h3>No scans found</h3>
                            <p>Start your first analysis to see history here.</p>
                            <a href="/" class="btn-primary">
                                <i class="fas fa-play"></i> Start Analysis
                            </a>
                        </td>
                    </tr>
                `;
                return;
            }

            let html = '';
            data.scans.forEach(scan => {
                const confidence = parseInt(scan.confidence);
                const riskClass = confidence >= 70 ? 'critical' : confidence >= 40 ? 'elevated' : 'minimal';
                
                html += `
                    <tr>
                        <td>${formatDate(scan.created_at)}</td>
                        <td>
                            <span class="type-badge ${scan.type}">
                                <i class="fas fa-${scan.type === 'url' ? 'link' : scan.type === 'email' ? 'envelope' : 'comment'}"></i>
                                ${scan.type.toUpperCase()}
                            </span>
                        </td>
                        <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                            ${scan.content}
                        </td>
                        <td>
                            <span class="verdict-badge ${scan.verdict.toLowerCase()}">${scan.verdict}</span>
                        </td>
                        <td>
                            <div class="risk-level">
                                <div class="risk-bar">
                                    <div class="risk-fill ${riskClass}" style="width: ${confidence}%"></div>
                                </div>
                                <span>${scan.risk_level}</span>
                            </div>
                        </td>
                        <td>${scan.confidence}%</td>
                        <td>${scan.analysis_source || 'AI'}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn-icon" onclick="viewScan(${scan.id})" title="View Details">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="btn-icon delete" onclick="deleteScan(${scan.id})" title="Delete">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            tableBody.innerHTML = html;

            // Update pagination
            currentPage = data.current_page;
            totalPages = data.pages;
            totalItems = data.total;

            startItem.textContent = ((currentPage - 1) * 10) + 1;
            endItem.textContent = Math.min(currentPage * 10, totalItems);
            totalItemsEl.textContent = totalItems;

            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;

            updatePageNumbers();
        }

        // Format date
        function formatDate(isoString) {
            const date = new Date(isoString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            if (diffDays < 7) return `${diffDays}d ago`;
            
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        // Update page numbers
        function updatePageNumbers() {
            const pageNumbers = document.getElementById('pageNumbers');
            let html = '';
            
            const start = Math.max(1, currentPage - 2);
            const end = Math.min(totalPages, currentPage + 2);

            for (let i = start; i <= end; i++) {
                html += `<button class="page-number ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }

            pageNumbers.innerHTML = html;
        }

        // Change page
        function changePage(direction) {
            if (direction === 'prev' && currentPage > 1) {
                loadHistory(currentPage - 1);
            } else if (direction === 'next' && currentPage < totalPages) {
                loadHistory(currentPage + 1);
            }
        }

        // Go to specific page
        function goToPage(page) {
            if (page !== currentPage) {
                loadHistory(page);
            }
        }

        // Apply filters
        function applyFilters() {
            currentFilters = {
                search: document.getElementById('search').value,
                type: document.getElementById('typeFilter').value,
                risk: document.getElementById('riskFilter').value
            };
            loadHistory(1);
        }

        // Reset filters
        function resetFilters() {
            document.getElementById('search').value = '';
            document.getElementById('typeFilter').value = 'all';
            document.getElementById('riskFilter').value = 'all';
            currentFilters = { search: '', type: 'all', risk: 'all' };
            loadHistory(1);
        }

        // View scan details
        function viewScan(scanId) {
            window.location.href = `/api/history/${scanId}`;
        }

        // Delete scan
        async function deleteScan(scanId) {
            if (!confirm('Are you sure you want to delete this scan? This action cannot be undone.')) {
                return;
            }

            try {
                const response = await fetch(`/api/history/${scanId}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    showToast('Scan deleted successfully', 'success');
                    loadHistory(currentPage);
                } else {
                    showToast(data.error || 'Failed to delete scan', 'error');
                }
            } catch (error) {
                showToast('Error deleting scan', 'error');
            }
        }

        // Toast notification
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icons = {
                success: 'check-circle',
                error: 'exclamation-circle',
                warning: 'exclamation-triangle',
                info: 'info-circle'
            };
            
            toast.innerHTML = `
                <div class="toast-icon">
                    <i class="fas fa-${icons[type]}"></i>
                </div>
                <div class="toast-content">
                    <div class="toast-title">${type.charAt(0).toUpperCase() + type.slice(1)}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()">
                    <i class="fas fa-times"></i>
                </button>
            `;
            
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Enter key in search
        document.getElementById('search').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                applyFilters();
            }
        });
    </script>
</body>
</html>
